[project]
name = "invoice-analyzer-backend"
version = "0.1.0"
description = "Backend API for Invoice & Delivery Note Analyzer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.9.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
